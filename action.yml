name: interragate
description: Explain a Terraform or OpenTofu plan, flag risky changes and post the summary to the pull request.
branding:
  icon: eye
  color: purple

inputs:
  plan:
    description: Plan file (from plan -out) or plan JSON, relative to working-directory.
    required: true
  working-directory:
    description: The Terraform working directory.
    default: "."
  fail-on:
    description: "Lowest severity that fails the step: critical, high, medium, low or none."
    default: high
  comment:
    description: Create or update one pull request comment with the summary.
    default: "false"
  report-artifact:
    description: Artifact name for the interactive HTML report. Empty to skip.
    default: interragate-report
  github-token:
    description: Token used to post the comment.
    default: ${{ github.token }}
  scan:
    description: Scanners to run on the configuration as well, comma-separated (trivy, checkov, tflint); each must be installed. interragate keeps what concerns this plan.
    default: ""
  sarif:
    description: Upload the findings to code scanning ("true"), so they appear in the Security tab and on the pull request's files. Needs security-events write permission.
    default: "false"
  base:
    description: Git ref to compare the configuration with, to tell your edits from everything else. Defaults to the pull request's base branch; check out with fetch-depth 0 for it to be found.
    default: ""

outputs:
  risk:
    description: Overall risk level (none, info, low, medium, high, critical).
    value: ${{ steps.check.outputs.risk }}
  findings:
    description: Number of findings.
    value: ${{ steps.check.outputs.findings }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.x
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Build interragate
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/interragate" ./cmd/interragate

    - name: Check the plan
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLAN: ${{ inputs.plan }}
        FAIL_ON: ${{ inputs.fail-on }}
        SCAN: ${{ inputs.scan }}
        BASE: ${{ inputs.base }}
        BASE_REF: ${{ github.base_ref }}
        SARIF: ${{ inputs.sarif }}
      run: |
        set +e
        extra=()
        if [ -n "$SCAN" ]; then extra+=(--scan "$SCAN"); fi
        if [ -n "$BASE" ]; then extra+=(--base "$BASE"); elif [ -n "$BASE_REF" ]; then extra+=(--base "origin/$BASE_REF"); fi
        # stdout is GitHub annotations, shown inline on the .tf lines in the diff.
        "$RUNNER_TEMP/interragate" check "$PLAN" --fail-on "$FAIL_ON" -f github "${extra[@]}" \
          --markdown "$RUNNER_TEMP/interragate.md" --json "$RUNNER_TEMP/interragate.json" --html "$RUNNER_TEMP/interragate-report.html"
        status=$?
        if [ "$SARIF" = "true" ]; then
          if ! "$RUNNER_TEMP/interragate" check "$PLAN" --fail-on none -f sarif "${extra[@]}" > "$RUNNER_TEMP/interragate.sarif"; then
            exit 1
          fi
        fi
        set -e
        if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
        cat "$RUNNER_TEMP/interragate.md" >> "$GITHUB_STEP_SUMMARY"
        echo "risk=$(jq -r .risk.level "$RUNNER_TEMP/interragate.json")" >> "$GITHUB_OUTPUT"
        echo "findings=$(jq '.findings | length' "$RUNNER_TEMP/interragate.json")" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Upload findings to code scanning
      if: inputs.sarif == 'true' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        sarif_file: ${{ runner.temp }}/interragate.sarif
        category: interragate-${{ inputs.working-directory }}

    - name: Upload the report
      if: inputs.report-artifact != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report-artifact }}
        path: ${{ runner.temp }}/interragate-report.html

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.actor != 'dependabot[bot]' && github.event.pull_request.number && github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        DIR: ${{ inputs.working-directory }}
      run: |
        marker="<!-- interragate:$DIR -->"
        body="$(printf '%s\n%s' "$marker" "$(cat "$RUNNER_TEMP/interragate.md")")"
        author=$(gh api user --jq .login 2>/dev/null || printf '%s' 'github-actions[bot]')
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          | jq -sr --arg marker "$marker" --arg author "$author" \
            '[.[][] | select(.user.login == $author and ((.body // "") | startswith($marker)))] | first | .id // empty')
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
        else
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
        fi

    - name: Fail on findings
      if: steps.check.outputs.status == '2'
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "::error::interragate found issues at or above '$FAIL_ON'. See the job summary."
        exit 1
