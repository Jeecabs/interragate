[extend]
useDefault = true

[[allowlists]]
description = "Deliberately fake values used by the redaction regression tests"
condition = "AND"
regexTarget = "secret"
paths = [
  '''(^|/)internal/(analysis/edits|diff/diff)_test\.go$''',
  '''(^|/)testdata/plans/redact\.json$''',
]
regexes = ['''^hunter2-SECRET(?:-(?:old|new))?$''']

[[allowlists]]
description = "random_string output generated by the local mechanics fixture, not an API credential"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)testdata/plans/mechanics\.(terraform|tofu)\.txt$''']
regexes = ['''^\s*~ api_key\s*=\s*"[A-Za-z0-9]{32}" -> \(known after apply\)\s*$''']
